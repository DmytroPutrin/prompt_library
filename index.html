<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1><span class="accent">&gt;_</span> Prompt Library</h1>
    </header>

    <form id="prompt-form" class="prompt-form">
      <label for="prompt-title">Title</label>
      <input id="prompt-title" type="text" placeholder="e.g. Code reviewer" required>

      <label for="prompt-content">Content</label>
      <textarea id="prompt-content" rows="6" placeholder="Write your prompt here..." required></textarea>

      <button type="submit" class="btn-save">Save Prompt</button>
    </form>

    <section>
      <h2 class="section-title">// saved prompts</h2>
      <p id="empty-state" class="empty-state">No prompts saved yet.</p>
      <div id="prompt-list" class="prompt-list"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
