<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Library</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1><span class="accent">&gt;_</span> Prompt Library</h1>
    </header>

    <form id="prompt-form" class="prompt-form">
      <label for="prompt-title">Title</label>
      <input id="prompt-title" type="text" placeholder="e.g. Code reviewer" required>

      <label for="prompt-content">Content</label>
      <textarea id="prompt-content" rows="6" placeholder="Write your prompt here..." required></textarea>

      <label for="prompt-model">Model</label>
      <input id="prompt-model" type="text" maxlength="100" placeholder="e.g. Claude Opus 5.5" required>

      <label class="checkbox-label">
        <input id="prompt-is-code" type="checkbox">
        Contains code (adjusts token estimate)
      </label>

      <p id="form-error" class="form-error" role="alert" hidden></p>

      <button type="submit" class="btn-save">Save Prompt</button>
    </form>

    <section>
      <div class="section-header">
        <h2 class="section-title">// saved prompts</h2>
        <div class="io-toolbar">
          <button type="button" id="export-btn" class="btn-small">Export</button>
          <button type="button" id="import-btn" class="btn-small">Import</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden>
        </div>
      </div>
      <div id="io-status" class="io-status" role="status" hidden></div>
      <p id="empty-state" class="empty-state">No prompts saved yet.</p>
      <div id="prompt-list" class="prompt-list"></div>
    </section>
  </main>

  <dialog id="app-dialog" class="dialog">
    <form method="dialog" class="dialog-body">
      <h3 id="dialog-title" class="dialog-title"></h3>
      <div id="dialog-message" class="dialog-message"></div>
      <label id="dialog-apply-all" class="checkbox-label" hidden>
        <input type="checkbox" id="dialog-apply-all-input">
        Apply this choice to all remaining conflicts
      </label>
      <div id="dialog-actions" class="dialog-actions"></div>
    </form>
  </dialog>

  <script src="metadata.js"></script>
  <script src="script.js"></script>
  <script src="io.js"></script>
</body>
</html>
